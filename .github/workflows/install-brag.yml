name: Install BRAG skill

on:
  push:
    branches:
      - chore/install-brag

permissions:
  contents: write

jobs:
  install-brag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install BRAG for Codex
        run: npx -y skills add https://github.com/latent-spaces/brag --skill brag --agent codex --copy --yes

      - name: Verify install
        run: |
          test -f .agents/skills/brag/SKILL.md
          test -d .agents/skills/brag/references
          test -d .agents/skills/brag/assets

      - name: Commit installed skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/brag
          if git diff --cached --quiet; then
            echo "BRAG already installed"
            exit 0
          fi
          git commit -m "chore: install BRAG Codex skill [skip ci]"
          git push
